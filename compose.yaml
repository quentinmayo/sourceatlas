services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    ports:
      - '127.0.0.1:7687:7687'
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:7474 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  app:
    build: .
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      READ_TOKEN: ${READ_TOKEN:?Set READ_TOKEN}
      WRITE_TOKEN: ${WRITE_TOKEN:?Set WRITE_TOKEN}
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped
volumes:
  neo4j-data:
